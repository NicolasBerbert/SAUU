# Configuração Nginx para SAUU - Oracle VM
# Copiar para /etc/nginx/sites-available/sauu e linkar em sites-enabled

server {
    listen 80;
    server_name _;  # Substituir pelo domínio quando disponível: ex. sauu.unifil.br

    # Redirecionar para HTTPS quando tiver domínio/certificado SSL
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache de assets estáticos do Next.js
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Limite de tamanho de upload (imagens de produtos)
    client_max_body_size 10M;
}

