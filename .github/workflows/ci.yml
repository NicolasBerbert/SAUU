name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality & Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

      - name: Prisma schema validation
        run: npx prisma validate

      # Auditoria só das dependências de produção e falha em CRITICAL.
      # Advisories "high" restantes são de upstream sem correção disponível
      # (Next.js na última versão) ou exigiriam downgrade que quebra o app
      # (cadeia transitiva do exceljs). Dev-only (vite/esbuild) não vão a produção.
      - name: Security audit (production, critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: Check for secrets in code
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
