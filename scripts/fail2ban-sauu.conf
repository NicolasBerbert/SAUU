# ─────────────────────────────────────────────────────────────────────────────
# SAUU — Filtro fail2ban customizado para a API Next.js
# Destino: /etc/fail2ban/filter.d/sauu-api.conf
# (copiado automaticamente pelo vm-hardening.sh)
#
# Detecta padrões no log do Nginx que indicam abuso da API:
#   - Muitos 401 (auth failures)
#   - Muitos 429 (rate limit hits — já bloqueado pelo Nginx, ban reforça no IP)
#   - Scan de rotas inexistentes (404 em /api/)
# ─────────────────────────────────────────────────────────────────────────────

[INCLUDES]
before = common.conf

[Definition]

# Captura IPs que recebem 401, 429, ou 403 repetidamente na API
failregex =
  # 429 Too Many Requests em qualquer rota da API
  ^<HOST> .* "(?:GET|POST|PUT|DELETE|PATCH) /api/.*" 429 .*$
  # 401 Unauthorized em rotas de auth
  ^<HOST> .* "POST /api/auth/.*" 401 .*$
  # 403 Forbidden em rotas admin (tentativa de acesso não autorizado)
  ^<HOST> .* "(?:GET|POST|PUT|DELETE) /api/admin/.*" 403 .*$
  # Scan de rotas inexistentes na API
  ^<HOST> .* "(?:GET|POST|PUT|DELETE) /api/.*" 404 .*$

ignoreregex =
  # Ignora o health check (UptimeRobot)
  ^<HOST> .* "GET /api/health" 200 .*$
  # Ignora webhook legítimo do Mercado Pago (IPs conhecidos do MP)
  ^<HOST> .* "POST /api/pagamento/webhook" .*$
