# ─────────────────────────────────────────────────────────────────────────────
# SAUU — Nginx configuration
# Destino: /etc/nginx/sites-available/sauu
# Ativar: ln -s /etc/nginx/sites-available/sauu /etc/nginx/sites-enabled/sauu
#         nginx -t && systemctl reload nginx
#
# Requer: Certbot instalado e certificado gerado para sauu.unifil.br
#   certbot --nginx -d sauu.unifil.br
# ─────────────────────────────────────────────────────────────────────────────

# Rate limiting — definido no contexto http (nginx.conf principal ou aqui)
# Limits por rota sensível
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=checkout_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=global_limit:10m rate=60r/m;

# ─── Redirect HTTP → HTTPS ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name sauu.unifil.br;

    # Certbot renew usa /.well-known/ — não redirecionar
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── IPs reais do Cloudflare (para real_ip_from) ─────────────────────────────
# Atualizar periodicamente: https://www.cloudflare.com/ips/
# IPv4
geo $cloudflare_ip {
    default 0;
    103.21.244.0/22   1;
    103.22.200.0/22   1;
    103.31.4.0/22     1;
    104.16.0.0/13     1;
    104.24.0.0/14     1;
    108.162.192.0/18  1;
    131.0.72.0/22     1;
    141.101.64.0/18   1;
    162.158.0.0/15    1;
    172.64.0.0/13     1;
    173.245.48.0/20   1;
    188.114.96.0/20   1;
    190.93.240.0/20   1;
    197.234.240.0/22  1;
    198.41.128.0/17   1;
}

# ─── HTTPS principal ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sauu.unifil.br;

    # Restaurar IP real do visitante via Cloudflare
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from  103.21.244.0/22;
    set_real_ip_from  103.22.200.0/22;
    set_real_ip_from  103.31.4.0/22;
    set_real_ip_from  104.16.0.0/13;
    set_real_ip_from  104.24.0.0/14;
    set_real_ip_from  108.162.192.0/18;
    set_real_ip_from  131.0.72.0/22;
    set_real_ip_from  141.101.64.0/18;
    set_real_ip_from  162.158.0.0/15;
    set_real_ip_from  172.64.0.0/13;
    set_real_ip_from  173.245.48.0/20;
    set_real_ip_from  188.114.96.0/20;
    set_real_ip_from  190.93.240.0/20;
    set_real_ip_from  197.234.240.0/22;
    set_real_ip_from  198.41.128.0/17;
    # IPv6 Cloudflare
    set_real_ip_from  2400:cb00::/32;
    set_real_ip_from  2606:4700::/32;
    set_real_ip_from  2803:f800::/32;
    set_real_ip_from  2405:b500::/32;
    set_real_ip_from  2405:8100::/32;
    set_real_ip_from  2a06:98c0::/29;
    set_real_ip_from  2c0f:f248::/32;

    # Certificados SSL (gerados pelo Certbot)
    ssl_certificate     /etc/letsencrypt/live/sauu.unifil.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sauu.unifil.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # TLS moderno — apenas TLS 1.2 e 1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — força HTTPS por 1 ano
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logs
    access_log /var/log/nginx/sauu_access.log;
    error_log  /var/log/nginx/sauu_error.log warn;

    # Limitar tamanho do body (protege contra upload abuse)
    client_max_body_size 2M;

    # ── Rate limiting por rota ───────────────────────────────────────────────

    # Rotas de autenticação — 5 req/min por IP
    location ~ ^/api/auth/(cadastro|login) {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    # Rotas de pagamento — 10 req/min por IP
    location ~ ^/api/(pagamento|checkout) {
        limit_req zone=checkout_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    # Webhook MP — sem rate limit (MP pode enviar múltiplas notificações)
    location /api/pagamento/webhook {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    # Tudo mais — 60 req/min por IP
    location / {
        limit_req zone=global_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }
}
